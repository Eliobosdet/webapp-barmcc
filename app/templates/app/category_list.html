{% extends "app/base.html" %}
{% block title %}Categorie - BARMCC{% endblock %}
{% block content %}
    <div class="container mt-4">
        <h1 class="mb-4">Seleziona Categoria</h1>
        <div class="row">
            {% for cat in categories %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border hover-shadow"
                         style="transition: 0.3s">
                        <div class="card-body text-center p-4">
                            <div class="mb-3">
                                <i class="bi bi-tag-fill text-warning" style="font-size: 2.5rem;"></i>
                            </div>
                            <h4 class="card-title fw-bold">{{ cat.name }}</h4>
                            <a href="{% url 'app:products_menu' %}?category={{ cat.id }}"
                               class="stretched-link"></a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
