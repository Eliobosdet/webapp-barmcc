<div class="modal fade"
     id="modalAddPerson"
     tabindex="-1"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Nuova Persona</h5>
                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
            </div>
            <form id="form-quick-person">
                {% csrf_token %}
                <div class="modal-body">
                    <input type="text"
                           name="first_name"
                           class="form-control mb-2"
                           placeholder="Nome *"
                           required>
                    <input type="text"
                           name="last_name"
                           class="form-control mb-2"
                           placeholder="Cognome *"
                           required>
                    <input type="text"
                           name="nickname"
                           class="form-control mb-2"
                           placeholder="Nickname">
                    <input type="email"
                           name="email"
                           class="form-control mb-2"
                           placeholder="Email">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               name="is_partner"
                               id="is_partner">
                        <label class="form-check-label" for="is_partner">Socio MCC</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success w-100">Crea</button>
                </div>
            </form>
        </div>
    </div>
</div>
